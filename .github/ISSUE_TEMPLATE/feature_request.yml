name: Feature request
description: Propose an improvement to the research workflow or contributor experience.
title: 'feat: '
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Who needs this, and what should they be able to do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Describe the smallest useful change and what can remain deferred.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior that would establish the outcome.
    validations:
      required: true
