name: Bug report
description: Report a reproducible problem in the local research workspace.
title: 'bug: '
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, browser, and relevant commit or branch.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant screenshots or sanitized error text. Omit credentials, private research, and raw provider output.
